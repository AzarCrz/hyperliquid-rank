<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperliquid — Where do you stand? / Où te situes-tu ?</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#16181d;--mute:#6a6f7a;--line:#e3e4e8;--acc:#0f766e;--accbg:#e6f4f2;--bar:#b8bec9;--warn:#92400e;--warnbg:#fdf3e3}
@media (prefers-color-scheme:dark){:root{--bg:#101215;--card:#181b20;--ink:#eceef1;--mute:#98a0ad;--line:#2a2e36;--acc:#2dd4bf;--accbg:#10302d;--bar:#4a515d;--warn:#f3c785;--warnbg:#2c2314}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:22px;line-height:1.25;margin:6px 0}
.lang{display:flex;gap:4px;flex-shrink:0}
.lang button{border:1px solid var(--line);background:transparent;color:var(--mute);padding:3px 9px;border-radius:999px;font-size:13px;cursor:pointer}
.lang button[aria-pressed=true]{color:var(--acc);border-color:var(--acc);background:var(--accbg);font-weight:600}
p.lead{margin:0 0 16px;color:var(--mute);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:6px}
.row{display:flex;gap:8px}
input[type=text],input[type=number]{flex:1;min-width:0;font:15px ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button.go{padding:0 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
@media (prefers-color-scheme:dark){button.go{color:#04201d}}
button.go:disabled{opacity:.6;cursor:default}
.tabs{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:999px;font-size:14px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
a.link,button.link{background:none;border:0;padding:0;color:var(--acc);font-size:14px;cursor:pointer;text-decoration:underline;margin-top:12px;display:inline-block}
#manual{display:none;margin-top:10px}
#res{margin-top:16px;display:none}
.big{font-size:44px;font-weight:700;line-height:1.1;color:var(--acc)}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--mute)}
svg{width:100%;height:auto;display:block}
.note{font-size:13px;color:var(--mute);margin-top:14px}
.err{color:#b91c1c;font-size:14px;margin-top:10px}
@media (prefers-color-scheme:dark){.err{color:#fca5a5}}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
td,th{padding:6px 0;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}
td:nth-child(2),th:nth-child(2){text-align:right;font-variant-numeric:tabular-nums}
th{color:var(--mute);font-size:12px}
tr.sel td{color:var(--acc);font-weight:600}
tr.pick{cursor:pointer}
h2{font-size:14px;margin:16px 0 0;color:var(--mute);font-weight:600}
.share{margin-top:14px}
</style>
</head>
<body>
<main>
<div class="top">
  <h1 id="t_title"></h1>
  <div class="lang"><button data-l="fr" aria-pressed="false">FR</button><button data-l="en" aria-pressed="false">EN</button></div>
</div>
<p class="lead" id="t_lead"></p>

<div class="card">
  <label for="addr" id="t_label"></label>
  <div class="row">
    <input id="addr" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="0x…">
    <button class="go" id="go"></button>
  </div>
  <div class="tabs" id="tabs" role="group"></div>
  <div class="err" id="err" role="alert"></div>
  <button class="link" id="mtoggle"></button>
  <div id="manual">
    <label for="mvol" id="t_mlabel"></label>
    <input id="mvol" type="number" inputmode="decimal" min="0" step="any" placeholder="250000">
  </div>
  <div id="res">
    <div class="big" id="top"></div>
    <div class="sub" id="sub"></div>
    <div class="stats">
      <div class="stat"><b id="vol"></b><span id="t_vol"></span></div>
      <div class="stat"><b id="med"></b><span id="t_med"></span></div>

    <svg id="chart" viewBox="0 0 600 178" role="img"></svg>
    <h2 id="t_thr"></h2>
    <table><tbody id="thr"></tbody></table>
    <div id="allwrap"><h2 id="t_all"></h2><table><tbody id="all"></tbody></table></div>
    <button class="link share" id="share"></button>
  </div>
</div>
<p class="note" id="foot"></p>
</main>

const QS=D.q, T=D.t, WK=["day","week","month","allTime"];
const I18N={
 fr:{loc:"fr-FR",units:["Md","M","k"],
  title:"Où te situes-tu sur Hyperliquid ?",
  lead:"Colle une adresse de wallet : pas de connexion, pas de signature. Tu vois où se situe ton volume de trading par rapport aux autres traders actifs.",
  label:"Adresse du wallet (0x…)",go:"Voir",busy:"Lecture…",

let L=(navigator.language||"en").toLowerCase().startsWith("fr")?"fr":"en";
let W=3, vols=null, manual=false, last=null;
const $=id=>document.getElementById(id);
const tr=()=>I18N[L];

function fmtNum(x,max){return x.toLocaleString(tr().loc,{maximumFractionDigits:max});}
function fmtUSD(x){
  const u=tr().units, fr=L==="fr", sp=fr?" ":"";
  if(x>=1e9)return "$"+fmtNum(x/1e9,2)+sp+u[0];
  if(x>=1e6)return "$"+fmtNum(x/1e6,2)+sp+u[1];
  if(x>=1e3)return "$"+fmtNum(x/1e3,1)+sp+u[2];
  return "$"+fmtNum(x,0);
}
function fmtPct(p){return fmtNum(p,p<1?2:1);}

// part des wallets actifs dont le volume est <= v (interpolation log entre seuils)
function quantileOf(v,w){
  const t=T[WK[w]],n=t.length;
  if(v<=t[0])return {q:QS[0],edge:"low"};
  if(v>=t[n-1])return {q:QS[n-1],edge:"high"};
  let lo=0,hi=n-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(t[m]<=v)lo=m;else hi=m;}
  const f=(Math.log(v)-Math.log(t[lo]))/(Math.log(t[hi])-Math.log(t[lo]));
  return {q:QS[lo]+f*(QS[hi]-QS[lo]),edge:null};
}
function topText(r){
  if(r.edge==="low")return L==="fr"?"Top > 99,9 %":"Top > 99.9%";
  if(r.edge==="high")return L==="fr"?"Top < 0,1 %":"Top < 0.1%";
  const p=(1-r.q)*100;return "Top "+fmtPct(p)+(L==="fr"?" %":"%");
}
function chart(v,r){
  const t=T[WK[W]],n=t.length,xmin=Math.log10(t[0]),xmax=Math.log10(t[n-1]);
  const X=l=>40+(l-xmin)/(xmax-xmin)*540, Y=p=>150-p*130;
  let d="";t.forEach((x,i)=>{d+=(i?"L":"M")+X(Math.log10(x)).toFixed(1)+" "+Y(QS[i]).toFixed(1);});
  let s=`<line x1="40" x2="580" y1="150" y2="150" stroke="var(--line)"/>`;
  [0,.5,1].forEach(p=>{s+=`<line x1="40" x2="580" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="34" y="${Y(p)+4}" font-size="11" text-anchor="end" fill="var(--mute)">${p*100}${L==="fr"?" %":"%"}</text>`;});
  const lab={0:"$1",3:"$1k",6:"$1M",9:"$1"+tr().units[0],12:"$1T"};
  for(let e=Math.ceil(xmin);e<=Math.floor(xmax);e++){if(lab[e]){s+=`<text x="${X(e)}" y="168" font-size="11" text-anchor="middle" fill="var(--mute)">${lab[e]}</text>`;}}
  s+=`<path d="${d}" fill="none" stroke="var(--bar)" stroke-width="2.5"/>`;
  const lv=Math.min(xmax,Math.max(xmin,Math.log10(Math.max(v,1))));
  const px=X(lv),py=Y(r.q);
  s+=`<line x1="${px}" x2="${px}" y1="${py}" y2="150" stroke="var(--acc)" stroke-dasharray="4 3"/><line x1="40" x2="${px}" y1="${py}" y2="${py}" stroke="var(--acc)" stroke-dasharray="4 3"/><circle cx="${px}" cy="${py}" r="6" fill="var(--acc)"/>`;
  $("chart").innerHTML=s;
}
function currentVolume(){
  if(manual){const x=parseFloat($("mvol").value);return isFinite(x)&&x>0?x:null;}
  return vols?vols[W]:null;
}
function render(){
  const T_=tr(),v=currentVolume();
  if(v===null||v<=0){
    if(vols&&!manual){$("res").style.display="none";$("err").textContent=T_.none;}
    else{$("res").style.display="none";}
    return;
  }
  if(!manual)$("err").textContent="";
  const r=quantileOf(v,W),t=T[WK[W]],med=t[QS.indexOf(0.5)];
  $("res").style.display="block";
  $("top").textContent=topText(r);
  const p=r.q*100;
  $("sub").textContent=r.edge==="low"?T_.lowedge:r.edge==="high"?T_.highedge:T_.sub(fmtPct(p),T_.per[W]);
  $("vol").textContent=fmtUSD(v);
  const ratio=v/med;$("med").textContent="×"+fmtNum(ratio,ratio<10?2:ratio<100?1:0);
  chart(v,r);
  $("thr").innerHTML=[0.5,0.75,0.9,0.95,0.99].map(q=>`<tr><td>${T_.thrrow(fmtNum((1-q)*100,0))}</td><td>${fmtUSD(t[QS.indexOf(q)])}</td></tr>`).join("");
  // tableau toutes périodes (mode adresse seulement)
  if(vols&&!manual){
    $("allwrap").style.display="block";
    $("all").innerHTML=`<tr><th>${T_.allh[0]}</th><th>${T_.allh[1]}</th><th>${T_.allh[2]}</th></tr>`+vols.map((x,i)=>{
      const rr=x>0?quantileOf(x,i):null;
      return `<tr class="pick ${i===W?"sel":""}" data-i="${i}"><td>${T_.tabs[i]}</td><td>${x>0?fmtUSD(x):"—"}</td><td>${rr?topText(rr):"—"}</td></tr>`;}).join("");
  }else{$("allwrap").style.display="none";}
  last={top:topText(r),v:fmtUSD(v),per:T_.tabs[W]};
}
function applyLang(){
  const T_=tr();document.documentElement.lang=L;
  $("t_title").textContent=T_.title;$("t_lead").textContent=T_.lead;$("t_label").textContent=T_.label;
  $("go").textContent=T_.go;$("mtoggle").textContent=T_.mtoggle;$("t_mlabel").textContent=T_.mlabel;
  $("t_vol").textContent=T_.vol;$("t_med").textContent=T_.med;$("t_thr").textContent=T_.thr;$("t_all").textContent=T_.all;
  $("share").textContent=T_.share;
  $("tabs").innerHTML=T_.tabs.map((n,i)=>`<button class="tab" data-w="${i}" aria-pressed="${i===W}">${n}</button>`).join("");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  const d=new Date(D.generated).toLocaleDateString(T_.loc,{day:"numeric",month:"long",year:"numeric"});
  $("foot").textContent=T_.foot(D.sample.toLocaleString(T_.loc),D.seen.toLocaleString(T_.loc),D.hours,d);
  render();
}
function parsePortfolio(j){
  if(!Array.isArray(j))throw new Error("format");
  const d={};
  for(const it of j){if(Array.isArray(it)&&it.length===2&&it[1]&&typeof it[1]==="object"){d[it[0]]=parseFloat(it[1].vlm)||0;}}
  if(!Object.keys(d).length)throw new Error("format");
  return WK.map(k=>d[k]||0);
}
async function lookup(){
  const raw=$("addr").value.trim().toLowerCase();$("err").textContent="";
  if(!/^0x[0-9a-f]{40}$/.test(raw)){$("err").textContent=tr().bad;$("res").style.display="none";return;}
  manual=false;$("manual").style.display="none";
  const btn=$("go");btn.disabled=true;btn.textContent=tr().busy;
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),15000);
    const r=await fetch("https://api.hyperliquid.xyz/info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"portfolio",user:raw}),signal:ctl.signal});
    clearTimeout(to);
    if(!r.ok)throw new Error("http "+r.status);
    vols=parsePortfolio(await r.json());
    render();
  }catch(e){
    vols=null;$("res").style.display="none";$("err").textContent=tr().api;
  }finally{btn.disabled=false;btn.textContent=tr().go;}
}
$("go").onclick=lookup;
$("addr").addEventListener("keydown",e=>{if(e.key==="Enter")lookup();});
$("mtoggle").onclick=()=>{manual=!manual;$("manual").style.display=manual?"block":"none";$("err").textContent="";if(manual){$("mvol").focus();}render();};
$("mvol").addEventListener("input",render);
$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;W=+b.dataset.w;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
$("all").addEventListener("click",e=>{const row=e.target.closest("tr.pick");if(!row)return;W=+row.dataset.i;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.w===W));render();});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;applyLang();});
$("share").onclick=async()=>{
  if(!last)return;
  const txt=tr().sharetxt(last.top,last.v,last.per.toLowerCase(),location.href.split("#")[0]);
  try{await navigator.clipboard.writeText(txt);const o=$("share").textContent;$("share").textContent=tr().copied;setTimeout(()=>{$("share").textContent=tr().share;},1800);}catch(e){}
};
applyLang();
</script>
